name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the supported floor (package.json engines); 24 is the current LTS line.
        node: [22, 24]
    steps:
      # Actions are pinned to a full commit SHA; the tag it was taken from is in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Browser smoke (runner Chrome)
        if: matrix.node == 22
        run: npm run smoke
        env:
          SMOKE_REQUIRED: '1'
          CHROME_PATH: /usr/bin/google-chrome
