<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Household and food budget · Recipe Bank</title>
  <link rel="stylesheet" href="./household.css">
  <link rel="stylesheet" href="./budget.css">
  <style>
    :root { color-scheme: light; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --rb-text: #e5edf0; --rb-surface: #17232a; --rb-input: #202f37;
      --rb-border: #52636e; --rb-muted: #b4c3cc; --rb-accent: #377d5e;
      --rb-on-accent: #fff; --rb-focus: #8ac6ff; --rb-danger: #ffb3ad;
    }
    body { max-width: 76rem; margin: var(--rb-space-zero, 0) auto; padding: var(--rb-space-lg, 1.5rem); background: var(--rb-input, #f3f6f4); color: var(--rb-text, #202b32); font-family: var(--rb-font, system-ui, sans-serif); line-height: 1.5; }
    header { margin-bottom: var(--rb-space-lg, 1.5rem); }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); gap: var(--rb-space-lg, 1.5rem); align-items: start; }
    select { font: inherit; color: var(--rb-text, #202b32); background: var(--rb-input, #fff); border: 1px solid var(--rb-border, #c7d0d5); border-radius: var(--rb-control-radius, 0.375rem); padding: var(--rb-space-sm, 0.5rem); }
    :focus-visible { outline: 3px solid var(--rb-focus, #2873cc); outline-offset: var(--rb-space-xs, 0.25rem); }
  </style>
</head>
<body>
  <header>
    <h1>Plan for your household</h1>
    <p>Standalone Recipe Bank preview. Changes stay in this browser. Both features work for this visit if storage is disabled.</p>
    <label>Preview theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </header>
  <main><div id="household"></div><div id="budget"></div></main>
  <noscript>Enable JavaScript to edit the device-local household and budget.</noscript>
  <script type="module">
    import { mount as mountHousehold } from './household.mjs';
    import { mount as mountBudget } from './budget.mjs';
    const householdElement = document.querySelector('#household');
    const household = mountHousehold(householdElement);
    const budget = mountBudget(document.querySelector('#budget'), { householdElement });
    document.querySelector('#theme').addEventListener('change', (event) => {
      document.documentElement.dataset.theme = event.target.value;
    });
    window.addEventListener('pagehide', (event) => {
      if (!event.persisted) { household.destroy(); budget.destroy(); }
    });
  </script>
</body>
</html>
