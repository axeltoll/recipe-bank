<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <title>Recipe Bank</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <script>
    // Apply a saved theme before first paint. The toggle lives in ui/theme.js.
    try {
      var t = JSON.parse(localStorage.getItem('rb:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage unavailable: follow the system */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" id="skip" href="#view">Skip to content</a>

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="mark-bg" width="32" height="32" rx="8"/>
          <path class="mark-fg" d="M9 20c0-5 3-9 7-9s7 4 7 9z"/>
          <rect class="mark-fg" x="7" y="20" width="18" height="3" rx="1.5"/>
        </svg>
        <span>Recipe Bank</span>
      </a>
      <nav class="nav" id="nav" aria-label="Sections" hidden></nav>
      <p class="stats" id="stats"></p>
      <div class="topbar-actions">
        <div class="mount" id="mount-topbar" data-mount="topbar"></div>
        <button class="btn btn-quiet icon-btn" id="theme-toggle" type="button" aria-label="Switch theme"></button>
        <button class="btn btn-primary" id="open-add" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add video</span>
        </button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1" data-layout="list" data-view="loading">
    <div class="home" aria-busy="true">
      <div class="home-head">
        <div class="home-title">
          <h1>What are we cooking?</h1>
          <p class="home-sub">Loading recipes…</p>
        </div>
      </div>
      <div class="home-main">
        <div class="grid" aria-hidden="true">
          <div class="card skel"><div class="card-media"></div><div class="card-body"><span class="skel-line"></span><span class="skel-line short"></span></div></div>
          <div class="card skel"><div class="card-media"></div><div class="card-body"><span class="skel-line"></span><span class="skel-line short"></span></div></div>
          <div class="card skel"><div class="card-media"></div><div class="card-body"><span class="skel-line"></span><span class="skel-line short"></span></div></div>
          <div class="card skel"><div class="card-media"></div><div class="card-body"><span class="skel-line"></span><span class="skel-line short"></span></div></div>
          <div class="card skel"><div class="card-media"></div><div class="card-body"><span class="skel-line"></span><span class="skel-line short"></span></div></div>
          <div class="card skel"><div class="card-media"></div><div class="card-body"><span class="skel-line"></span><span class="skel-line short"></span></div></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Recipes link to and embed the creators' own videos.</p>
    <label class="switch" for="offline-switch">
      <input type="checkbox" id="offline-switch" role="switch">
      <span>Keep recipes for offline use</span>
    </label>
    <p class="footer-note" id="offline-note" aria-live="polite"></p>
  </footer>

  <dialog class="modal" id="add-dialog" aria-labelledby="add-title">
    <form id="add-form" method="dialog">
      <h2 id="add-title">Add a recipe video</h2>
      <p class="muted" id="add-intro">Paste a video link from YouTube, TikTok, Instagram, Facebook, Pinterest or X. It joins the queue, and the research agent writes up the ingredients and steps.</p>
      <label for="add-url">Video link</label>
      <input id="add-url" name="url" type="url" inputmode="url" autocomplete="off" enterkeyhint="go" required
             placeholder="https://www.youtube.com/shorts/…" aria-describedby="add-detect add-error">
      <p class="field-hint" id="add-detect" aria-live="polite"></p>
      <label class="switch" for="add-web">
        <input type="checkbox" id="add-web" name="allowWeb">
        <span>It's a web page with a video on it (any other HTTPS site)</span>
      </label>
      <label for="add-note">Note for the agent <span class="muted">(optional)</span></label>
      <textarea id="add-note" name="note" rows="2" maxlength="500" placeholder="e.g. I want the sauce quantities"></textarea>
      <p class="form-error" id="add-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="add-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="add-submit">Add to queue</button>
      </div>
    </form>
  </dialog>

  <dialog class="cook" id="cook" aria-label="Cook mode"></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
