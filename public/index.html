<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Bank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2410c'/%3E%3Cpath d='M9 20c0-5 3-9 7-9s7 4 7 9z' fill='%23fff7ed'/%3E%3Crect x='7' y='20' width='18' height='3' rx='1.5' fill='%23fff7ed'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Recipe Bank</span>
    </a>
    <p class="stats" id="stats" aria-live="polite"></p>
    <button class="btn btn-primary" id="open-add" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
      Add video
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form" method="dialog">
      <h2 id="add-title">Add a recipe video</h2>
      <p class="muted">Paste a YouTube Short, TikTok or Instagram Reel. It joins the queue, and the research agent writes up the ingredients and steps.</p>
      <label for="add-url">Video link</label>
      <input id="add-url" name="url" type="url" inputmode="url" autocomplete="off" required
             placeholder="https://www.youtube.com/shorts/…">
      <p class="field-hint" id="add-detect" aria-live="polite"></p>
      <label for="add-note">Note for the agent <span class="muted">(optional)</span></label>
      <textarea id="add-note" name="note" rows="2" maxlength="500" placeholder="e.g. I want the sauce quantities"></textarea>
      <p class="form-error" id="add-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="add-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="add-submit">Add to queue</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
